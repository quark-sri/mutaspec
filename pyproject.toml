[project]
name = "mutaspec"
version = "0.0.0"
description = "Measure how good your tests are by planting bugs and checking which ones your tests catch."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
mutaspec = "mutaspec.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutaspec"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
