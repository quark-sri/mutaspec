    <text x="112" y="458" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0">Clean run passes</text>
    <text x="400" y="420" font-size="30" font-weight="700" fill="#ffffff">Inject</text>
    <text x="400" y="458" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0">Plant Mutants</text>
    <text x="688" y="420" font-size="30" font-weight="700" fill="#ffffff">Run &amp; Score</text>
    <text x="688" y="458" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0">Killed or Survived</text>
    <text x="976" y="420" font-size="30" font-weight="700" fill="#ffffff">Suggest</text>
    <text x="976" y="458" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0">What to test next</text>
