    <rect x="954.75" y="318.75" width="234.5" height="168.5" rx="25.5" fill="none" stroke="url(#glassEdge)" stroke-opacity="1" stroke-width="1.5"/>
  </g>
<g filter="url(#shadow)">
    <g clip-path="url(#clipChip)">
      <rect width="1280" height="640" fill="url(#bg)"/><use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
      <rect x="522.0" y="526" width="236" height="42" fill="#fda4af" fill-opacity="0.16"/>
    </g>
    <rect x="522.75" y="526.75" width="234.5" height="40.5" rx="20.5" fill="none" stroke="#fda4af" stroke-opacity="0.85" stroke-width="1.5"/>
  </g>
  <g transform="translate(540.0 535)" fill="none" stroke="#fda4af" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22 L5 14 L17 2 L23 8 L11 20 Z"/><path d="M14 5 L20 11"/></g>
  <text x="658.0" y="554" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">You write the tests</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="124" cy="352" r="17" fill="url(#badge)" filter="url(#softGlow)"/><text x="124" y="358">1</text>
    <circle cx="412" cy="352" r="17" fill="url(#badge)" filter="url(#softGlow)"/><text x="412" y="358">2</text>
    <circle cx="700" cy="352" r="17" fill="url(#badge)" filter="url(#softGlow)"/><text x="700" y="358">3</text>
    <circle cx="988" cy="352" r="17" fill="url(#badge)" filter="url(#softGlow)"/><text x="988" y="358">4</text>
