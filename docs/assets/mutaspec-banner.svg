      <rect x="666" y="318" width="236" height="170" fill="url(#glassFill)"/><rect x="666" y="318" width="236" height="56" fill="url(#sheen)"/>
    </g>
    <rect x="666.75" y="318.75" width="234.5" height="168.5" rx="25.5" fill="none" stroke="url(#glassEdge)" stroke-opacity="1" stroke-width="1.5"/>
  </g>
<g filter="url(#shadow)">
    <g clip-path="url(#clip3)">
      <rect width="1280" height="640" fill="url(#bg)"/><use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
