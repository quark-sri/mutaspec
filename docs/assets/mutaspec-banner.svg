<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">mutaspec</title>
  <desc id="desc">mutaspec: measure how good your tests are. Workflow: 1 run the clean baseline, 2 inject Mutants, 3 run the suites and score Killed or Survived per test level, 4 suggest what to test next. You write the tests, then run the next round against the same Mutants.</desc>
  <style>
    svg { --ok: #86efac; }
    @media (prefers-reduced-motion: reduce) { .mover { display: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/><stop offset="0.45" stop-color="#0b1240"/><stop offset="1" stop-color="#160a3a"/>
    </linearGradient>
    <radialGradient id="gA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.85"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f43f5e" stop-opacity="0.8"/><stop offset="1" stop-color="#f43f5e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.7"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gD" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#06b6d4" stop-opacity="0.55"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <g id="blobs">
      <ellipse cx="210" cy="150" rx="360" ry="280" fill="url(#gA)"/>
      <ellipse cx="1090" cy="120" rx="380" ry="260" fill="url(#gB)"/>
      <ellipse cx="660" cy="560" rx="460" ry="220" fill="url(#gC)"/>
      <ellipse cx="1120" cy="560" rx="260" ry="200" fill="url(#gD)"/>
      <ellipse cx="120" cy="560" rx="240" ry="180" fill="url(#gB)" opacity="0.6"/>
    </g>
    <filter id="frost" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="8" in="SourceAlpha" result="a"/><feFlood flood-color="#fecdd3" flood-opacity="0.55"/>
      <feComposite operator="in" in2="a" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fecdd3" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/><stop offset="0.5" stop-color="#f97316"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="streamBack" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#fecdd3"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="clipHeader"><rect x="240" y="44" width="800" height="200" rx="34"/></clipPath>
    <clipPath id="clip0"><rect x="90" y="318" width="236" height="170" rx="26"/></clipPath>
    <clipPath id="clip1"><rect x="378" y="318" width="236" height="170" rx="26"/></clipPath>
    <clipPath id="clip2"><rect x="666" y="318" width="236" height="170" rx="26"/></clipPath>
    <clipPath id="clip3"><rect x="954" y="318" width="236" height="170" rx="26"/></clipPath>
    <clipPath id="clipChip"><rect x="522.0" y="526" width="236" height="42" rx="21"/></clipPath>
    <path id="flow0" d="M326 403.0 H378"/>
    <path id="flow1" d="M614 403.0 H666"/>
    <path id="flow2" d="M902 403.0 H954"/>
    <path id="loopBack" d="M1072.0 488 C1072.0 576 1042.0 586 982.0 586 H298.0 C238.0 586 208.0 576 208.0 490"/>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <use href="#blobs" xlink:href="#blobs"/>
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/>
    <path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640M1200 0V640"/>
  </g>
  <g fill="#ffffff">
    <circle cx="96" cy="70" r="1.6" opacity="0.6"/><circle cx="1180" cy="290" r="1.4" opacity="0.5"/>
    <circle cx="1010" cy="24" r="1.2" opacity="0.7"/><circle cx="160" cy="280" r="1.2" opacity="0.5"/>
    <circle cx="1240" cy="620" r="1.6" opacity="0.4"/><circle cx="40" cy="420" r="1.3" opacity="0.5"/>
  </g>
  <g fill="none" stroke-linecap="round" filter="url(#softGlow)">
    <use href="#flow0" xlink:href="#flow0" stroke="url(#stream)" stroke-width="3"/>
    <use href="#flow1" xlink:href="#flow1" stroke="url(#stream)" stroke-width="3"/>
    <use href="#flow2" xlink:href="#flow2" stroke="url(#stream)" stroke-width="3"/>
    <use href="#loopBack" xlink:href="#loopBack" stroke="url(#streamBack)" stroke-width="2.5" stroke-opacity="0.8" stroke-dasharray="10 8"/>
  </g>
  <g fill="#fecdd3" filter="url(#softGlow)">
    <path d="M369 397.0 L379 403.0 L369 409.0 Z"/>
    <path d="M657 397.0 L667 403.0 L657 409.0 Z"/>
    <path d="M945 397.0 L955 403.0 L945 409.0 Z"/>
    <path d="M202.0 497 L208.0 487 L214.0 497 Z" fill="#fb7185"/>
  </g>
  <g class="mover">
    <circle r="5" fill="url(#sphere)"><animateMotion dur="1.6s" begin="0.0s" repeatCount="indefinite"><mpath href="#flow0" xlink:href="#flow0"/></animateMotion></circle>
    <circle r="5" fill="url(#sphere)"><animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite"><mpath href="#flow1" xlink:href="#flow1"/></animateMotion></circle>
    <circle r="5" fill="url(#sphere)"><animateMotion dur="1.6s" begin="1.0s" repeatCount="indefinite"><mpath href="#flow2" xlink:href="#flow2"/></animateMotion></circle>
    <circle r="6" fill="url(#sphere)"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#loopBack" xlink:href="#loopBack"/></animateMotion></circle>
  </g>
<g filter="url(#shadow)">
    <g clip-path="url(#clipHeader)">
      <rect width="1280" height="640" fill="url(#bg)"/><use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
      <rect x="240" y="44" width="800" height="200" fill="url(#glassFill)"/><rect x="240" y="44" width="800" height="66" fill="url(#sheen)"/>
    </g>
    <rect x="240.75" y="44.75" width="798.5" height="198.5" rx="33.5" fill="none" stroke="url(#glassEdge)" stroke-opacity="1" stroke-width="1.5"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="140" font-size="88" font-weight="700" letter-spacing="-2" fill="#ffffff" filter="url(#textGlow)">mutaspec</text>
    <text x="640" y="184" font-size="28" font-weight="500" fill="#f1f5f9">Plant bugs. See which ones your tests catch.</text>
    <text x="640" y="222" font-size="19" font-weight="600" letter-spacing="1.5" fill="#fda4af">Any language · Any test command · Git worktrees · Agent Skills</text>
  </g>
<g filter="url(#shadow)">
