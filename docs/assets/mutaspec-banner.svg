  <text x="640" y="624" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1.2" fill="#fda4af">NEXT ROUND · SAME MUTANTS · SCORE PER TEST LEVEL</text>
